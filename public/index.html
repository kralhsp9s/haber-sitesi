<!DOCTYPE html>
<html lang="tr" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Instagram Enterprise Intelligence</title>
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#0f172a">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 500: '#e1306c', 600: '#c13584', 700: '#833ab4' }
          }
        }
      }
    }
  </script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col font-sans antialiased selection:bg-brand-500 selection:text-white">

  <!-- LOGIN OVERLAY -->
  <div id="login-screen" class="fixed inset-0 z-50 bg-slate-950 flex items-center justify-center p-4">
    <div class="max-w-md w-full bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
      <div class="text-center space-y-2">
        <div class="inline-flex p-4 rounded-full bg-gradient-to-tr from-amber-500 via-rose-500 to-purple-600 text-white mb-2">
          <i class="fa-brands fa-instagram text-4xl"></i>
        </div>
        <h1 class="text-2xl font-bold tracking-tight text-white">Enterprise Access</h1>
        <p class="text-sm text-slate-400">Devam etmek için envanter kimlik bilgilerinizi girin.</p>
      </div>
      <form id="login-form" class="space-y-4">
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Kullanıcı Adı</label>
          <input type="text" id="username" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500">
        </div>
        <div>
          <label class="block text-xs font-semibold uppercase tracking-wider text-slate-400 mb-1">Şifre</label>
          <input type="password" id="password" required class="w-full bg-slate-800 border border-slate-700 rounded-lg px-4 py-3 text-white focus:outline-none focus:border-brand-500">
        </div>
        <button type="submit" class="w-full bg-gradient-to-r from-rose-500 to-purple-600 text-white font-semibold py-3 rounded-lg hover:opacity-90 transition shadow-lg">Giriş Yap</button>
      </form>
    </div>
  </div>

  <!-- MAIN DASHBOARD ARCHITECTURE -->
  <div id="app-dashboard" class="hidden flex-1 flex flex-col">
    <!-- NAVBAR -->
    <header class="bg-slate-800/80 backdrop-blur-md border-b border-slate-700 sticky top-0 z-40 px-6 py-4 flex items-center justify-between">
      <div class="flex items-center space-x-3">
        <i class="fa-brands fa-instagram text-2xl text-rose-500"></i>
        <span class="font-bold text-lg tracking-wide bg-gradient-to-r from-rose-400 to-purple-400 bg-clip-text text-transparent">InstaTracker Enterprise</span>
      </div>
      <div class="flex items-center space-x-3">
        <button id="btn-sync" title="Günde 8 Limitli Taramayı Şimdi Çalıştır" class="bg-emerald-600 hover:bg-emerald-500 text-white px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-2">
          <i class="fa-solid fa-rotate"></i> <span>Şimdi Senkronize Et</span>
        </button>
        <button id="btn-notifications" class="bg-slate-700 hover:bg-slate-600 text-slate-200 px-3 py-2 rounded-lg text-xs" title="Tarayıcı bildirimleri">
          <i class="fa-regular fa-bell"></i> Bildirimleri Aç
        </button>
        <button id="btn-install" class="hidden bg-purple-600 hover:bg-purple-500 text-white px-3 py-2 rounded-lg text-xs" title="Ana ekrana ekle">
          <i class="fa-solid fa-mobile-screen-button"></i> Ana Ekrana Ekle
        </button>
        <button id="btn-api-key" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-lg text-sm" title="API Key Ayarları">
          <i class="fa-solid fa-key"></i>
        </button>
        <button id="btn-theme" class="bg-slate-700 hover:bg-slate-600 text-slate-200 p-2.5 rounded-lg text-sm">
          <i class="fa-solid fa-moon"></i>
        </button>
        <button id="btn-logout" class="bg-rose-600 hover:bg-rose-500 text-white p-2.5 rounded-lg text-sm" title="Çıkış Yap">
          <i class="fa-solid fa-right-from-bracket"></i>
        </button>
      </div>
    </header>

    <!-- CONTENT GRID -->
    <main class="flex-1 max-w-7xl w-full mx-auto p-6 grid grid-cols-1 lg:grid-cols-3 gap-6">
      
      <!-- LEFT COLUMN: Profil Yönetimi ve Ekleme -->
      <section class="space-y-6">
        <!-- Profil Ekle Card -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-base font-semibold mb-4 flex items-center gap-2 text-rose-400">
            <i class="fa-solid fa-user-plus"></i> Target Profil Ekle
          </h2>
          <form id="add-profile-form" class="space-y-3">
            <input type="text" id="target-username" placeholder="Instagram Kullanıcı Adı (ör: instagram)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
            <input type="text" id="target-userid" placeholder="Instagram Numeric User ID (ör: 25025320)" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-sm text-white focus:outline-none focus:border-rose-500">
            <button type="submit" class="w-full bg-rose-600 hover:bg-rose-500 text-white font-medium py-2 rounded-lg text-sm transition">Profi̇li̇ Takibe Al</button>
          </form>
        </div>

        <!-- Takip Edilen Profiller Listesi -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-base font-semibold mb-3 flex items-center justify-between text-slate-200">
            <span><i class="fa-solid fa-users text-purple-400"></i> Takip Edilen Profiller</span>
            <span id="profile-count" class="text-xs bg-slate-700 px-2 py-0.5 rounded-full">0</span>
          </h2>
          <div id="profile-list" class="space-y-2 max-h-80 overflow-y-auto pr-1">
            <!-- Dinamik doldurulacak -->
          </div>
        </div>

        <!-- Sistem Canlı Akış Logları -->
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg">
          <h2 class="text-base font-semibold mb-3 flex items-center gap-2 text-amber-400">
            <i class="fa-solid fa-list-check"></i> Canlı Etkileşim & Değişim Logları
          </h2>
          <div id="log-list" class="space-y-2 max-h-72 overflow-y-auto text-xs font-mono">
            <!-- Loglar burada belirecek -->
          </div>
        </div>
      </section>

      <!-- RIGHT COLUMN: Medya Galeri ve İçerik Takibi -->
      <section class="lg:col-span-2 space-y-4">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-5 shadow-lg min-h-[500px]">
          
          <!-- Üst Başlık -->
          <h2 class="text-lg font-bold flex items-center gap-2 text-slate-100 mb-6">
            <i class="fa-brands fa-instagram text-rose-500 text-xl"></i> Profil Arşivi
          </h2>

          <!-- Instagram Tarzı Responsive Sekmeler -->
          <div class="flex border-b border-slate-700 mb-4 sm:mb-6">
            <button onclick="switchTab('post')" id="tab-post" class="flex-1 pb-2 sm:pb-3 text-[10px] sm:text-sm font-semibold text-rose-400 border-b-2 border-rose-500 transition-all flex justify-center items-center gap-1 sm:gap-2">
              <i class="fa-solid fa-table-cells"></i> GÖNDERİLER
            </button>
            <button onclick="switchTab('reel')" id="tab-reel" class="flex-1 pb-2 sm:pb-3 text-[10px] sm:text-sm font-semibold text-slate-500 hover:text-slate-300 border-b-2 border-transparent transition-all flex justify-center items-center gap-1 sm:gap-2">
              <i class="fa-solid fa-clapperboard"></i> REELS
            </button>
            <button onclick="switchTab('story')" id="tab-story" class="flex-1 pb-2 sm:pb-3 text-[10px] sm:text-sm font-semibold text-slate-500 hover:text-slate-300 border-b-2 border-transparent transition-all flex justify-center items-center gap-1 sm:gap-2">
              <i class="fa-solid fa-circle-notch"></i> HİKAYELER
            </button>
          </div>

          <!-- Tam Mobil Uyumlu Grid (Aralar 1px) -->
          <div id="media-grid" class="grid grid-cols-3 gap-1 sm:gap-3">
            <!-- Dinamik içerik -->
          </div>
      </section>
  <!-- API KEY MODAL -->
  <div id="api-modal" class="hidden fixed inset-0 z-50 bg-black/70 flex items-center justify-center p-4">
    <div class="bg-slate-800 border border-slate-700 rounded-xl p-6 max-w-md w-full space-y-4">
      <h3 class="text-lg font-bold text-white flex items-center gap-2"><i class="fa-solid fa-key text-amber-400"></i> RapidAPI Yapılandırması</h3>
      <div>
        <label class="block text-xs text-slate-400 mb-1">x-rapidapi-key</label>
        <input type="text" id="modal-api-key" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">RapidAPI Host</label>
        <input type="text" id="modal-api-host" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
      </div>
      <div>
        <label class="block text-xs text-slate-400 mb-1">Media API Path</label>
        <input type="text" id="modal-api-path" placeholder="/user_medias" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-xs text-white">
        <p class="text-[10px] text-slate-500 mt-1">Profilin kendi gönderilerini döndüren endpoint'i yazın.</p>
      </div>
      <div class="flex justify-end gap-2">
        <button id="close-modal" class="px-4 py-2 bg-slate-700 text-slate-300 rounded-lg text-xs">İptal</button>
        <button id="save-api-key" class="px-4 py-2 bg-rose-600 text-white rounded-lg text-xs">Kaydet</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
